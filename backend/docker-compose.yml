services:
  postgres:
    image: postgres:16-alpine
    container_name: inception-postgres
    environment:
      POSTGRES_DB: inception
      POSTGRES_USER: inception
      POSTGRES_PASSWORD: inception
    ports:
      - "15432:5432"
    volumes:
      - inception_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inception -d inception"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  inception_pg_data:
