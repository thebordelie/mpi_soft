spring:
  application:
    name: inception-api

  datasource:
    url: jdbc:postgresql://localhost:15432/inception
    username: inception
    password: inception
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

inception:
  jwt:
    secret: "aPeJScUYjGir2XwpojGmSuAYtp6WYFaqXREEJ1UkQYY"
    expiration-seconds: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security: INFO
